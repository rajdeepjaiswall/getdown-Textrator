name: Backend SQL check

on:
  push:
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["supabase/**"]
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Apply migration on a Supabase-like stub and run smoke tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stub_auth.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/smoke.sql
