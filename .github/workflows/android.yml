name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      AUTH_MODE: ${{ vars.AUTH_MODE || 'optional' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional: your own Play Store key. Without it the committed dev key is used,
      # which still lets every new APK install over the previous one.
      - name: Decode signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APKs (Go + Play) and Play Store bundle
        working-directory: android
        run: gradle assembleGoRelease assembleFullRelease bundleFullRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          # Website download: Go build (no Accessibility → not blocked by Play Protect).
          cp android/app/build/outputs/apk/go/release/app-go-release.apk out/GetDownTextrator.apk
          # Play Store build, for ADB testing and upload.
          cp android/app/build/outputs/apk/full/release/app-full-release.apk out/GetDownTextrator-PlayStore.apk
          cp android/app/build/outputs/bundle/fullRelease/app-full-release.aab out/GetDownTextrator-PlayStore.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GetDownTextrator-${{ env.VERSION_NAME }}
          path: out/*

      - name: Publish GitHub Release (latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Textrator ${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            out/GetDownTextrator.apk
            out/GetDownTextrator-PlayStore.apk
            out/GetDownTextrator-PlayStore.aab
          body: |
            GETDOWN Textrator ${{ env.VERSION_NAME }}
            - **GetDownTextrator.apk**: install this on any Android phone (website download).
            - **GetDownTextrator-PlayStore.aab**: upload to Google Play Console.
            - **GetDownTextrator-PlayStore.apk**: Play version for testing via ADB. Play Protect blocks it when installed from a browser or file manager.
            Commit: ${{ github.sha }}
